# Rotazione log SpamBox - pensata per SD card (RPi/DietPi): evita crescita
# illimitata di logs/app.log e logs/analysis.jsonl.
#
# Installazione:
#   sudo cp systemd/spambox-logrotate.conf /etc/logrotate.d/spambox
#
# Adattare il path se /opt/spambox non è la directory di installazione.

/opt/spambox/logs/app.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    su spambox spambox
}

/opt/spambox/logs/analysis.jsonl {
    monthly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    su spambox spambox
}
